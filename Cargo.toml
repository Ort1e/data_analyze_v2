[workspace]
resolver = "2"
members = [
    # root
    "plot_helper",
    "dynamique_plot",
    "dynamique_plot_test"
]


[workspace.dependencies]

# legacy
lazy_static = "1.4.0"
serde = "1.0.159"
serde_derive = "1.0.159"
serde_json = "1.0.94"
csv = "1.3.0"

rayon = {version = "1.9.0"}
sqlite = {version="0.36.0"}

indexmap = {version = "2.0.0", features = ["serde"]} # preserve order of insertion (json)

# log
log = "0.4.20"
test-log = "0.2.14"

# plot
plotters = "0.3.3"
plotters-canvas = "^0.3.0"
web-sys = { version = "0.3.70", features = ["HtmlCanvasElement"] }
paste = "1.0.14" # concatenate macro identifier

approx = "0.5.1"

base64 = "0.22.1"

wasm-rs-dbg = "0.1.2"

# egui
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
image = { version = "0.25", features = ["png", "webp"] }
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
] }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


[patch.crates-io]

# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }

# If you fork https://github.com/emilk/egui you can test with:
# egui = { path = "../egui/crates/egui" }
# eframe = { path = "../egui/crates/eframe" }