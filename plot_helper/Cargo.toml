[package]
name = "plot_helper"
version = "0.1.0"
edition = "2021"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]


[features]
parrallelize = ["dep:rayon"] # add rayon to dependencies to parallelize
sqlite = ["dep:sqlite"] # add sqlite to dependencies to use sqlite


[package.metadata]
# Include test resources
test_resources = ["tests/test_data"]
html_resources = ["ressources/static.html"]

[dependencies]

# legacy
lazy_static = {workspace = true}
serde = {workspace = true}
serde_derive = {workspace = true}
serde_json = {workspace = true}
csv = {workspace = true}

rayon = {workspace = true, optional = true}
sqlite = {workspace = true, optional = true}

indexmap = {workspace = true} # preserve order of insertion (json)

# log
log = {workspace = true}
test-log = {workspace = true}

# plot
plotters = {workspace = true}
paste = {workspace = true} # concatenate macro identifier

[dev-dependencies]
approx = {workspace = true}